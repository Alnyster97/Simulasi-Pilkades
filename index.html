<script>
const candidates=[
 {id:1,name:"KANDIDAT 1",code:"K01",isPhoto:false},
 {id:2,name:"ABAD BADRUZAMAN",code:"K02",isPhoto:true,photoSrc:"Abad.jpeg"},
 {id:3,name:"KANDIDAT 3",code:"K03",isPhoto:false},
 {id:4,name:"KANDIDAT 4",code:"K04",isPhoto:false},
 {id:5,name:"KANDIDAT 5",code:"K05",isPhoto:false}
];
let selectedCandidate=null,currentReceiptData=null,hasVotedCurrentSession=false,auditBoxRecords=[];
function getSilhouetteSVG(isConfirmation=false){
 const sizeClass=isConfirmation?"w-56 h-64 sm:w-64 sm:h-80":"w-full h-full";
 return `<svg class="${sizeClass}" viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
 <path d="M24 230 C24 176, 54 156, 76 150 L100 198 L124 150 C146 156, 176 176, 176 230 Z" fill="#26292E"/><path d="M76 150 L64 178 L84 186 L100 204 L116 186 L136 178 L124 150 L100 198 Z" fill="#181A1D"/><polygon points="78,148 122,148 100,202" fill="#FFFFFF"/><polygon points="94,152 106,152 104,163 96,163" fill="#2D3138"/><polygon points="96,163 104,163 108,195 100,204 92,195" fill="#2D3138"/><path d="M84 128 L84 152 Q100 162 116 152 L116 128 Z" fill="#FFFFFF" stroke="#26292E" stroke-width="3"/><ellipse cx="100" cy="86" rx="38" ry="48" fill="#FFFFFF" stroke="#26292E" stroke-width="3.5"/><path d="M62 82 C60 44, 80 28, 102 28 C126 28, 140 44, 138 82 C136 62, 126 48, 102 48 C78 48, 66 62, 62 82 Z" fill="#26292E"/></svg>`;
}
function renderCandidates(){
 const grid=document.getElementById('candidates-grid');
 grid.innerHTML=candidates.map(c=>{
  let visual=c.isPhoto ? `<img src="${c.photoSrc}" alt="${c.name}" class="w-full h-full object-cover object-top" onerror="this.outerHTML='<div class=\\'w-[88%] h-[92%] flex items-end justify-center\\'>${getSilhouetteSVG(false).replace(/'/g,"\\'")}</div>';">` : `<div class="w-[88%] h-[92%] flex items-end justify-center">${getSilhouetteSVG(false)}</div>`;
  return `<button onclick="selectCandidate(${c.id})" class="group flex flex-col items-center focus:outline-none transition-transform duration-150 active:scale-95 cursor-pointer" aria-label="Pilih ${c.name}"><div class="candidate-card w-full aspect-[4/5] bg-white group-hover:bg-[#F50000] border-2 border-slate-400/80 group-hover:border-red-700 shadow-md relative overflow-hidden flex items-end justify-center transition-colors duration-150"><div class="absolute top-2 left-2 w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white border border-slate-300 text-black font-black text-lg sm:text-xl flex items-center justify-center shadow z-10">${c.id}</div>${visual}</div><span class="candidate-name mt-2 text-xs sm:text-sm md:text-base font-extrabold text-[#1E2022] tracking-wide uppercase">${c.name}</span></button>`;
 }).join('');
}
function selectCandidate(id){
 if(hasVotedCurrentSession){showToast("Sesi demo ini sudah selesai. Tekan R untuk mengulang sesi.");return;}
 selectedCandidate=candidates.find(c=>c.id===id);if(!selectedCandidate)return;
 document.getElementById('confirm-number').textContent=selectedCandidate.id;
 document.getElementById('confirm-badge').textContent=selectedCandidate.id;
 document.getElementById('confirm-name').textContent=selectedCandidate.name;
 const portrait=document.getElementById('confirm-portrait');
 portrait.innerHTML=selectedCandidate.isPhoto?`<img src="${selectedCandidate.photoSrc}" alt="${selectedCandidate.name}" class="w-full h-full object-cover object-top" onerror="this.outerHTML='<div class=\\'w-full h-full flex items-end justify-center\\'>${getSilhouetteSVG(true).replace(/'/g,"\\'")}</div>';">`:getSilhouetteSVG(true);
 document.getElementById('screen-confirm').classList.remove('hidden');
}
function cancelSelection(){selectedCandidate=null;document.getElementById('screen-confirm').classList.add('hidden')}
function confirmVote(){
 if(!selectedCandidate)return;
 hasVotedCurrentSession=true;
 const randomSalt=Math.random().toString(36).substring(2,10).toUpperCase();
 const demoToken=`DEMO-${randomSalt}`;
 const now=new Date();
 const timestampStr=now.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 const serialId=`DEMO-${String(auditBoxRecords.length+1).padStart(4,'0')}`;
 currentReceiptData={serialId,timestamp:timestampStr,candidate:selectedCandidate,token:demoToken};
 document.getElementById('receipt-time').textContent=timestampStr;
 document.getElementById('receipt-serial').textContent=serialId;
 document.getElementById('receipt-token').textContent=demoToken;
 document.getElementById('scanner-decoded-text').textContent="Token demo berhasil ditampilkan (tidak memuat pilihan).";
 hideScannerResult();renderQRCode('receipt-qrcode',demoToken);
 document.getElementById('screen-confirm').classList.add('hidden');
 document.getElementById('screen-ballot').classList.add('hidden');
 document.getElementById('screen-receipt').classList.remove('hidden');
}
function renderQRCode(elementId,textData){
 const container=document.getElementById(elementId);container.innerHTML="";
 if(typeof QRCode==="undefined"){container.innerHTML='<p class="text-red-600 text-xs font-bold">Library QR tidak tersedia.</p>';return;}
 new QRCode(container,{text:textData,width:180,height:180,colorDark:"#0f172a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}
function simulateBarcodeScan(){
 const laser=document.getElementById('scanner-laser-line'),box=document.getElementById('scanner-result-box');
 laser.classList.remove('hidden');box.classList.add('hidden');
 setTimeout(()=>{laser.classList.add('hidden');box.classList.remove('hidden')},650);
}
function hideScannerResult(){document.getElementById('scanner-laser-line').classList.add('hidden');document.getElementById('scanner-result-box').classList.add('hidden')}
function depositToAuditBox(){
 if(!currentReceiptData)return;
 auditBoxRecords.push(currentReceiptData);
 showToast("Simulasi selesai. Data demo tersimpan sementara di memori halaman.");
 currentReceiptData=null;selectedCandidate=null;
 document.getElementById('screen-receipt').classList.add('hidden');document.getElementById('screen-ballot').classList.remove('hidden');
}
function resetSimulation(){
 hasVotedCurrentSession=false;selectedCandidate=null;currentReceiptData=null;
 document.getElementById('screen-confirm').classList.add('hidden');document.getElementById('screen-receipt').classList.add('hidden');document.getElementById('screen-ballot').classList.remove('hidden');
 showToast("Sesi demo direset.");
}
function openAuditModal(){
 const total=auditBoxRecords.length;document.getElementById('modal-total-ballots').textContent=total;
 document.getElementById('rekap-list').innerHTML=candidates.map(c=>{
  const count=auditBoxRecords.filter(r=>r.candidate.id===c.id).length,pct=total>0?Math.round(count/total*100):0;
  return `<div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-2.5"><div class="flex justify-between items-center text-xs font-bold mb-1 gap-2"><span>${String(c.id).padStart(2,'0')}. ${c.name}</span><span class="text-amber-300 whitespace-nowrap">${count} (${pct}%)</span></div><div class="w-full h-2 bg-slate-700 rounded-full overflow-hidden"><div class="h-full bg-sky-500 transition-all duration-300" style="width:${pct}%"></div></div></div>`;
 }).join('');
 document.getElementById('audit-modal').classList.remove('hidden');
}
function closeAuditModal(){document.getElementById('audit-modal').classList.add('hidden')}
function clearAllVotes(){auditBoxRecords=[];openAuditModal();showToast("Data demo dikosongkan.");}
function showToast(msg){
 const toast=document.getElementById('toast-notification');document.getElementById('toast-message').textContent=msg;toast.classList.remove('hidden');
 clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.add('hidden'),3000);
}
document.addEventListener('keydown',e=>{
 if(e.target&&['INPUT','TEXTAREA'].includes(e.target.tagName))return;
 if(e.key.toLowerCase()==='a')openAuditModal();
 if(e.key.toLowerCase()==='r')resetSimulation();
 if(e.key==='Escape'){closeAuditModal();cancelSelection();hideScannerResult();}
});
window.onload=renderCandidates;
</script>
