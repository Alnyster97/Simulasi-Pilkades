<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto QR Scanner</title>
    <!-- Memuat pustaka html5-qrcode dari CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            color: #fff;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            height: 100vh;
        }
        /* Menyembunyikan elemen bawaan pustaka yang tidak diperlukan agar bersih */
        #reader__dashboard_section_csr button,
        #reader__dashboard_section_swaplink {
            display: none !important;
        }
        .loading-text {
            position: absolute;
            text-align: center;
            z-index: 1;
            font-size: 14px;
            color: #aaa;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="loading-text">Menyiapkan kamera...</div>
    <div id="reader"></div>

    <script>
        // Fungsi yang akan dieksekusi saat QR code berhasil dibaca
        function onScanSuccess(decodedText, decodedResult) {
            // Hentikan scanner agar tidak memindai ulang secara terus-menerus
            html5QrCode.stop().then((ignore) => {
                console.log("Scanner dihentikan.");
                
                // LANGSUNG ALIHKAN KE HALAMAN TUJUAN
                // decodedText berisi string/URL hasil pembacaan QR Code
                // Anda bisa langsung arahkan ke URL tersebut atau sesuaikan dengan logika aplikasi Anda:
                window.location.href = decodedText; 
                
                // Catatan: Jika isi QR code hanya berupa kode unik (misal ID peserta/voter), 
                // ubah baris di atas menjadi: window.location.href = "halaman-tujuan.html?id=" + encodeURIComponent(decodedText);
            }).catch((err) => {
                console.error("Gagal menghentikan scanner: ", err);
            });
        }

        function onScanFailure(error) {
            // Error kegagalan frame biasa diabaikan agar konsol tidak penuh
            // karena scanner terus memindai setiap frame video
        }

        // Inisialisasi scanner pada elemen dengan id 'reader'
        const html5QrCode = new Html5Qrcode("reader");
        
        // Konfigurasi kamera
        const config = { 
            fps: 10,, // Jumlah frame per detik untuk pemindaian
            qrbox: { width: 250, height: 250 } // Kotak area fokus pemindaian di tengah
        };

        // Langsung mulai kamera belakang secara otomatis tanpa tombol
        Html5Qrcode.getCameras().devices.then(devices => {
            if (devices && devices.length) {
                // Pilih kamera belakang secara otomatis jika tersedia (biasanya index terakhir atau cari yang environment)
                let cameraId = devices[devices.length - 1].id;
                
                // Cari kamera belakang (environment) secara spesifik jika ada
                for (let i = 0; i < devices.length; i++) {
                    if (devices[i].label.toLowerCase().includes('back') || devices[i].label.toLowerCase().includes('belakang')) {
                        cameraId = devices[i].id;
                        break;
                    }
                }

                html5QrCode.start(
                    cameraId, 
                    config, 
                    onScanSuccess, 
                    onScanFailure
                ).catch(err => {
                    console.error("Gagal memulai kamera: ", err);
                    alert("Gagal mengakses kamera. Pastikan Anda memberikan izin akses kamera.");
                });
            } else {
                alert("Tidak ada kamera yang ditemukan pada perangkat ini.");
            }
        }).catch(err => {
            console.error("Kesalahan saat mendeteksi kamera: ", err);
        });
    </script>
</body>
</html>
